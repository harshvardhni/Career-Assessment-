        const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
        const hollandCode = sorted.slice(0, 3).map(item => item[0]).join("");
        return { raw: scores, sorted, hollandCode };
      },
      scoreTAMANA: (responses) => {
        const domainCounts = { LA: 0, AR: 0, VR: 0, MR: 0, NA: 0, SA: 0, PA: 0 };
        const domainTotals = { LA: 0, AR: 0, VR: 0, MR: 0, NA: 0, SA: 0, PA: 0 };
        TAMANA_QUESTIONS.forEach(q => {
          domainTotals[q.dim]++;
          if (responses[q.id] === q.correct) domainCounts[q.dim]++;
        });
        const percentiles = {};
        Object.keys(domainCounts).forEach(dim => {
          percentiles[dim] = TAMANA_NORMS.convertPercentile(domainCounts[dim], domainTotals[dim] || 1);
        });
        const sorted = Object.entries(percentiles).sort((a, b) => b[1] - a[1]);
        return { raw: domainCounts, percentiles, sorted, totals: domainTotals };
      },
      scoreMBTI: (responses) => {
        const counts = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
        MBTI_QUESTIONS.forEach(q => {
          const ans = responses[q.id];
          if (ans === "a") counts[q.axis[0]]++;
          if (ans === "b") counts[q.axis[1]]++;
        });
        const type = `${counts.E >= counts.I ? 'E' : 'I'}${counts.S >= counts.N ? 'S' : 'N'}${counts.T >= counts.F ? 'T' : 'F'}${counts.J >= counts.P ? 'J' : 'P'}`;
        return { counts, type };
      },
      scoreSOV: (p1, p2) => {
        const scores = { THE: 0, ECO: 0, AES: 0, SOC: 0, POL: 0, REL: 0 };
        SOV_PART1_QUESTIONS.forEach(q => {
          if (p1[q.id] === "A") scores[q.optA.val] += 2;
          if (p1[q.id] === "B") scores[q.optB.val] += 2;
        });
        SOV_PART2_QUESTIONS.forEach(q => {
          const rankObj = p2[q.id] || {};
          q.options.forEach(opt => {
            scores[opt.val] += Number(rankObj[opt.val] || 0);
          });
        });
        const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
        return { scores, sorted };
      },
      matchClusters: (sds, tamana, mbti, sov) => {
        const results = CAREER_CLUSTERS.map(c => {
          // SDS Similarity
          const sdsMax = Math.max(...Object.values(sds.raw), 1);
          let sdsDot = 0;
          Object.keys(c.sdsWeights).forEach(d => {
            sdsDot += ((sds.raw[d] || 0) / sdsMax) * c.sdsWeights[d];
          });
          // Aptitude TAMANA Match
          let tamanaDot = 0;
          Object.keys(c.tamanaWeights).forEach(d => {
            tamanaDot += ((tamana.percentiles[d] || 0) / 100) * c.tamanaWeights[d];
          });
          // MBTI alignment
          const mbtiScore = c.mbtiFit.includes(mbti.type) ? 1.0 : 0.65;
          // SOV Values Match
          const sovMax = Math.max(...Object.values(sov.scores), 1);
          let sovDot = 0;
          Object.keys(c.sovWeights).forEach(d => {
            sovDot += ((sov.scores[d] || 0) / sovMax) * c.sovWeights[d];
          });
          // Composite Score
          const comp = (tamanaDot * 0.35 + sdsDot * 0.30 + mbtiScore * 0.15 + sovDot * 0.20) * 100;
          return { ...c, fitScore: Math.min(98.5, Math.max(52.0, Number(comp.toFixed(1)))) };
        });
        results.sort((a, b) => b.fitScore - a.fitScore);
        return { all: results, top5: results.slice(0, 5) };
      }
    };

                          <span className="w-7 h-7 rounded-lg bg-slate-900 text-white font-bold text-xs flex items-center justify-center">#{rank + 1}</span>
                          <h3 className="text-sm font-bold text-slate-900">{c.name}</h3>
                        </div>
                        <span className="px-3 py-1 bg-pastel-sage text-pastel-sageDark text-xs font-extrabold rounded-full">Compatibility: {c.fitScore}%</span>
                      </div>
                      <p className="text-xs text-slate-600 mb-3">{c.description}</p>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs pt-2 border-t border-slate-100">
                        <div>
                          <strong className="text-slate-800 block mb-0.5">Educational Pathways:</strong>
                          <ul className="list-disc list-inside text-slate-600 space-y-0.5">
                            {c.pathways.slice(0, 3).map((p, i) => <li key={i}>{p}</li>)}
                          </ul>
                        </div>
                        <div>
                          <strong className="text-slate-800 block mb-0.5">Sample Occupations:</strong>
                          <ul className="list-disc list-inside text-slate-600 space-y-0.5">
                            {c.occupations.slice(0, 3).map((occ, i) => <li key={i}>{occ}</li>)}
                          </ul>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {/* SECTION 8: SYNTHESIS */}
              <div className="bg-slate-900 text-white p-6 sm:p-8 rounded-2xl space-y-3">
                <h2 className="text-xs font-bold uppercase tracking-wider text-pastel-lavender">Section 8: Consolidated Career Profile Synthesis</h2>
                <p className="text-xs text-slate-300 leading-relaxed">
                  Synthesizing your primary Holland Code (<strong>{sds.hollandCode}</strong>), peak cognitive aptitudes in <strong>{tamana.sorted[0][0]}</strong> and <strong>{tamana.sorted[1][0]}</strong>, with your <strong>{mbti.type}</strong> personality preference and primary value motive of <strong>{sov.sorted[0][0]}</strong> reveals strong natural compatibility with analytical, high-agency environments.
                </p>
                <p className="text-xs text-slate-400 leading-relaxed">
                  Your primary match—<strong>{clusters.top5[0].name}</strong>—capitalizes on your intrinsic abilities, offering optimal engagement and value alignment throughout your higher education and professional career.
                </p>
                <div className="pt-3 border-t border-slate-800 flex justify-between items-center text-[10px] text-slate-500">
                  <span>Report ID: CP-{participant.initial}-{Math.floor(100000 + Math.random() * 900000)}</span>
                  <span>Certified by Career Counseling Cell</span>
                </div>
              </div>

            </div>

            {/* Email Dispatch Modal */}
            {emailModalOpen && (
              <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                <div className="bg-white rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-xl border border-slate-100">
                  <h3 className="text-base font-bold text-slate-900 mb-1">Confirm Email Dispatch</h3>
                  <p className="text-xs text-slate-500 mb-4">
                    Confirm recipient email address. A copy is automatically delivered to the counseling administrator (<code className="text-slate-700">24bps015@psgcas.ac.in</code>).
                  </p>
                  <input
                    type="email"
                    value={participant.email}
                    onChange={(e) => setParticipant({ ...participant, email: e.target.value })}
                    className="w-full text-xs px-4 py-2.5 rounded-xl border border-slate-200 mb-4"
                  />
                  {emailStatus === "SENT" ? (
                    <div className="p-3 bg-emerald-50 text-emerald-700 rounded-xl text-xs font-semibold text-center mb-4">
                      Report Dispatched to {participant.email} & CC to Counselor!
                    </div>
                  ) : (
                    <div className="flex gap-3">
                      <button onClick={() => setEmailModalOpen(false)} className="w-1/2 py-2.5 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600">Cancel</button>
                      <button onClick={handleEmailDelivery} disabled={emailStatus === "SENDING"} className="w-1/2 py-2.5 rounded-xl bg-slate-900 text-white text-xs font-semibold">
                        {emailStatus === "SENDING" ? "Dispatching..." : "Send Report"}
                      </button>
                    </div>
                  )}
                </div>
              </div>
            )}
          </div>
        );
      }

      // =======================================================================
      // VIEW: ADMIN CONSOLE
      // =======================================================================
      if (view === "ADMIN") {
        if (!adminAuthorized) {
          return (
            <div className="max-w-md mx-auto px-4 py-20">
              <div className="bg-white rounded-3xl p-8 border border-slate-100 shadow-sm text-center">
                <div className="w-12 h-12 rounded-2xl bg-slate-100 flex items-center justify-center text-slate-800 mx-auto mb-4">
                  <Icon name="lock" className="w-6 h-6" />
                </div>
                <h2 className="text-xl font-bold text-slate-900 mb-1">Counselor Admin Portal</h2>
                <p className="text-xs text-slate-500 mb-6">Enter password to view centralized assessment records.</p>
                <input
                  type="password"
                  value={adminPassword}
                  onChange={(e) => setAdminPassword(e.target.value)}
                  placeholder="Enter administrator password"
                  className="w-full text-xs px-4 py-2.5 rounded-xl border border-slate-200 mb-4"
                />
                <div className="flex gap-3">
                  <button onClick={() => setView("LANDING")} className="w-1/2 py-2.5 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600">Back</button>
                  <button onClick={() => {
                    if (adminPassword === "admin123" || adminPassword === "psgcas") setAdminAuthorized(true);
                    else alert("Invalid password. (Demo: admin123)");
                  }} className="w-1/2 py-2.5 rounded-xl bg-slate-900 text-white text-xs font-semibold">
                    Authorize
                  </button>
                </div>
              </div>
            </div>
          );
        }

        const adminRecords = JSON.parse(localStorage.getItem("ghp_audit_db") || "[]");

        return (
          <div className="max-w-6xl mx-auto px-4 py-10">
            <div className="flex justify-between items-center mb-8">
              <div>
                <h1 className="text-2xl font-bold text-slate-900">Psychometric Central Database</h1>
                <p className="text-xs text-slate-500 mt-0.5">Automated synchronization with Google Sheets DATABASE audit trail</p>
              </div>
              <button onClick={() => setView("LANDING")} className="px-4 py-2 rounded-xl bg-slate-900 text-white text-xs font-semibold hover:bg-slate-800">
                Exit Console
              </button>
            </div>
            <div className="bg-white rounded-3xl border border-slate-200 overflow-hidden shadow-sm">
              <table className="w-full text-xs text-left">
                <thead className="bg-slate-50 border-b border-slate-200 text-slate-700">
                  <tr>
                    <th className="p-4">Timestamp</th>
                    <th className="p-4">Student Name</th>
                    <th className="p-4">Age / Gender</th>
                    <th className="p-4">Email</th>
                    <th className="p-4">Holland / MBTI</th>
                    <th className="p-4">Top Career Cluster</th>
                    <th className="p-4">Report Status</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {adminRecords.length > 0 ? (
                    adminRecords.map((rec, idx) => (
                      <tr key={idx} className="hover:bg-slate-50">
                        <td className="p-4 text-slate-500">{rec.timestamp}</td>
                        <td className="p-4 font-bold text-slate-900">{rec.name} ({rec.initial})</td>
                        <td className="p-4 text-slate-600">{rec.age} / {rec.gender}</td>
                        <td className="p-4 text-slate-600">{rec.email}</td>
                        <td className="p-4 font-semibold text-slate-800">{rec.hollandCode} • {rec.mbtiType}</td>
                        <td className="p-4 font-bold text-pastel-lavenderDark">{rec.topCluster}</td>
                        <td className="p-4"><span className="px-2 py-0.5 bg-emerald-50 text-emerald-700 rounded-full font-semibold">{rec.status}</span></td>
                      </tr>
                    ))
                  ) : (
                    <tr>
                      <td colSpan="7" className="p-8 text-center text-slate-400">No submissions recorded yet. Submissions populate here automatically upon report generation.</td>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>
        );
      }

      return null;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
