        sdsRaw[q.dim] += Number(state.responses.SDS[q.id] || 0);
      });
      const sdsSorted = Object.entries(sdsRaw).sort((a, b) => b[1] - a[1]);
      const hollandCode = sdsSorted.slice(0, 3).map(i => i[0]).join("");

      // 2. TAMANA
      const tamCounts = { LA: 0, AR: 0, VR: 0, MR: 0, NA: 0, SA: 0, PA: 0 };
      const tamTotals = { LA: 0, AR: 0, VR: 0, MR: 0, NA: 0, SA: 0, PA: 0 };
      TAMANA_QUESTIONS.forEach(q => {
        tamTotals[q.dim]++;
        if (state.responses.TAMANA[q.id] === q.correct) tamCounts[q.dim]++;
      });
      const tamPercentiles = {};
      Object.keys(tamCounts).forEach(dim => {
        const ratio = tamCounts[dim] / (tamTotals[dim] || 1);
        tamPercentiles[dim] = ratio >= 0.8 ? 90 : ratio >= 0.6 ? 75 : ratio >= 0.4 ? 50 : 25;
      });
      const tamSorted = Object.entries(tamPercentiles).sort((a, b) => b[1] - a[1]);

      // 3. MBTI
      const mbtiCounts = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
      MBTI_QUESTIONS.forEach(q => {
        const ans = state.responses.MBTI[q.id];
        if (ans === 'a') mbtiCounts[q.axis[0]]++;
        if (ans === 'b') mbtiCounts[q.axis[1]]++;
      });
      const mbtiType = `${mbtiCounts.E >= mbtiCounts.I ? 'E':'I'}${mbtiCounts.S >= mbtiCounts.N ? 'S':'N'}${mbtiCounts.T >= mbtiCounts.F ? 'T':'F'}${mbtiCounts.J >= mbtiCounts.P ? 'J':'P'}`;

      // 4. SOV
      const sovScores = { THE: 0, ECO: 0, AES: 0, SOC: 0, POL: 0, REL: 0 };
      SOV_PART1_QUESTIONS.forEach(q => {
        if (state.responses.SOV_P1[q.id] === "A") sovScores[q.optA.val] += 2;
        if (state.responses.SOV_P1[q.id] === "B") sovScores[q.optB.val] += 2;
      });
      SOV_PART2_QUESTIONS.forEach(q => {
        const obj = state.responses.SOV_P2[q.id] || {};
        q.options.forEach(opt => {
          sovScores[opt.val] += Number(obj[opt.val] || 0);
        });
      });
      const sovSorted = Object.entries(sovScores).sort((a, b) => b[1] - a[1]);

      // 5. 16 CLUSTER MATCHING ENGINE
      const clusterMatches = CAREER_CLUSTERS.map(c => {
        const sdsMax = Math.max(...Object.values(sdsRaw), 1);
        let sdsScore = 0;
        Object.keys(c.sdsWeights).forEach(d => {
          sdsScore += ((sdsRaw[d] || 0) / sdsMax) * c.sdsWeights[d];
        });

        let tamScore = 0;
        Object.keys(c.tamanaWeights).forEach(d => {
          tamScore += ((tamPercentiles[d] || 0) / 100) * c.tamanaWeights[d];
        });

        const mbtiScore = c.mbtiFit.includes(mbtiType) ? 1.0 : 0.65;

        const sovMax = Math.max(...Object.values(sovScores), 1);
        let sovScore = 0;
        Object.keys(c.sovWeights).forEach(d => {
          sovScore += ((sovScores[d] || 0) / sovMax) * c.sovWeights[d];
        });

        const composite = (tamScore * 0.35 + sdsScore * 0.30 + mbtiScore * 0.15 + sovScore * 0.20) * 100;
        return { ...c, fitScore: Math.min(98.5, Math.max(52.0, Number(composite.toFixed(1)))) };
      });

      clusterMatches.sort((a, b) => b.fitScore - a.fitScore);

      return {
        sdsRaw, sdsSorted, hollandCode,
        tamCounts, tamTotals, tamPercentiles, tamSorted,
        mbtiCounts, mbtiType,
        sovScores, sovSorted,
        top5: clusterMatches.slice(0, 5)
      };
    }

    window.triggerEmail = function() {
      const res = calculateResults();
      const db = JSON.parse(localStorage.getItem("app_audit_db") || "[]");
      db.unshift({
        timestamp: new Date().toLocaleString(),
        name: state.participant.fullName,
        initial: state.participant.initial,
        email: state.participant.email,
        hollandCode: res.hollandCode,
        mbtiType: res.mbtiType,
        topCluster: res.top5[0].name,
        status: "Dispatched to Participant + CC Admin (24bps015@psgcas.ac.in)"
      });
      localStorage.setItem("app_audit_db", JSON.stringify(db));
      alert(`Report successfully emailed to: ${state.participant.email}\nCC delivered to: 24bps015@psgcas.ac.in`);
    };

    window.authorizeAdmin = function() {
      const p = document.getElementById("admin-pass").value;
      if (p === "admin123" || p === "psgcas") {
        state.adminAuthorized = true;
        render();
      } else {
        alert("Invalid Password. (Demo: admin123)");
      }
    };

    // Initial Render
    render();
  </script>
</body>
</html>
